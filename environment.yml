# Reproducible environment for code/urbanBenchmark (CUFB-China).
# Versions are those the released tables were computed with (2026-09, Windows 11, Python 3.12.7).
#   conda env create -f environment.yml && conda activate cufb
name: cufb
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.3
  - networkx=3.3
  - joblib=1.4
  - shapely=2.1
  - pyproj=3.7
  - pyogrio=0.11
  - geopandas=1.1
  - matplotlib=3.9        # spectrum figures; without it runall still writes result.json but no spectrum
  # Technical Validation only (validate.py crosscheck)
  - momepy=0.11
  - osmnx=2.1
  - libpysal=4.14
